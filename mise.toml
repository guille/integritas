[tools]
hyperfine = "latest"
rust = "latest"

[tasks.build]
description = "Build the project"
run         = "cargo build"

[tasks.build-release]
description = "Build the project (release mode)"
run         = "cargo build --release"

[tasks.run]
description = "Run the project"
run         = "cargo run"

[tasks.run-release]
description = "Run the project (release mode)"
run         = "cargo run --release"

[tasks.test]
description = "Run tests"
run         = "cargo test"

[tasks.fmt]
description = "Format code"
run         = "cargo fmt"

[tasks.lint]
description = "Run clippy"
run         = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.bench]
description = "Run criterion benchmarks"
run         = "cargo bench --bench throughput --"

[tasks.bench-cli]
description = "Run hyperfine CLI benchmarks"
run         = "./scripts/bench-cli.sh"
